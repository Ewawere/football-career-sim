<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Career Sim</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    :root {
      --bg: #0f141f; --panel: #1a2130; --panel2: #222b3c; --line: #2d384c;
      --accent: #33b88c; --blue: #408cf2; --text: #f2f4f8; --muted: #8c96ad;
      --gold: #e6c04d; --sidebar-w: 200px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    #app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; min-width: 960px; }
    aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 0 0; }
    .brand { padding: 0 16px 16px; border-bottom: 1px solid var(--line); }
    .brand .tag { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
    .brand .season { font-size: 12px; color: var(--muted); margin-top: 4px; }
    nav.side { flex: 1; padding: 12px 8px; overflow-y: auto; }
    nav.side button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--muted); font-size: 13px; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
    nav.side button:hover { background: var(--panel2); color: var(--text); }
    nav.side button.active { background: var(--panel2); color: var(--text); font-weight: 600; }
    .side-foot { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--panel2); }
    .side-foot .name { font-size: 13px; font-weight: 600; }
    .side-foot .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    header.top { padding: 16px 24px 8px; }
    header.top .eyebrow { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    header.top h1 { font-size: 24px; font-weight: 700; margin-top: 2px; }
    header.top .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .content { flex: 1; overflow-y: auto; padding: 12px 24px 24px; }
    .panel { background: var(--panel); border-radius: 14px; padding: 16px; }
    .grid-3 { display: grid; grid-template-columns: 160px 1fr 1fr; gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-cell { background: var(--panel2); border-radius: 10px; padding: 12px; }
    .stat-cell b { display: block; font-size: 20px; }
    .stat-cell span { font-size: 11px; color: var(--muted); }
    .ovr-box { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; }
    .ovr-box .big { font-size: 48px; font-weight: 800; line-height: 1; }
    .ovr-box .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .ovr-box .pot { font-size: 13px; font-weight: 600; color: var(--gold); margin-top: 8px; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; margin: 18px 0 10px; }
    .strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .strip .cell { background: var(--panel); border-radius: 12px; padding: 14px; }
    .strip .cell b { display: block; font-size: 18px; }
    .strip .cell span { font-size: 11px; color: var(--muted); }
    .btn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 13px; cursor: pointer; background: var(--accent); color: #0a1210; }
    .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
    .btn.sm { padding: 8px 12px; font-size: 12px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .action-list button { display: block; width: 100%; text-align: left; margin-bottom: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 13px; cursor: pointer; }
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    table.data td { padding: 10px 8px; border-bottom: 1px solid rgba(45,56,76,0.5); }
    table.data tr.me { background: rgba(51,184,140,0.12); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip { background: var(--panel2); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
    .high { color: var(--accent); font-weight: 600; }
    .muted { color: var(--muted); }
    .inbox-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .inbox-row .who { color: var(--accent); font-weight: 600; font-size: 12px; }
    .attr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .attr-group h3 { font-size: 13px; color: var(--accent); margin-bottom: 12px; }
    .attr-row { display: grid; grid-template-columns: 1fr 36px; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; }
    .bar { grid-column: 1 / -1; height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
    .bar > i.good { background: var(--accent); }
    .feed-card { background: var(--panel); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .feed-card .badge { font-size: 10px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .feed-card .headline { font-size: 14px; font-weight: 600; }
    .feed-card .body { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; text-align: center; padding: 40px; }
    .gate h1 { font-size: 32px; }
    .gate p { color: var(--muted); max-width: 420px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--line); padding: 12px 16px; border-radius: 10px; font-size: 13px; max-width: 360px; z-index: 50; display: none; }
    .toast.show { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="gate" class="gate">
    <div style="color:var(--accent);font-weight:700;letter-spacing:0.08em;font-size:12px">FOOTBALL CAREER SIM</div>
    <h1>Live the career</h1>
    <p>Start as a teenager, fight for minutes, develop, transfer, and build a legacy.</p>
    <button class="btn" id="btnStart" style="padding:14px 28px;font-size:15px">Start Player Career</button>
  </div>
  <div id="app" class="hidden">
    <aside>
      <div class="brand"><div class="tag">CAREER SIM</div><div class="season" id="sideSeason">—</div></div>
      <nav class="side" id="sideNav">
        <button data-view="overview" class="active">Overview</button>
        <button data-view="league">League</button>
        <button data-view="transfers">Transfers</button>
        <button data-view="development">Development</button>
        <button data-view="news">News</button>
        <button data-view="inbox">Inbox</button>
      </nav>
      <div class="side-foot"><div class="name" id="sideName">—</div><div class="meta" id="sideMeta">—</div></div>
    </aside>
    <main>
      <header class="top">
        <div class="eyebrow" id="pageEyebrow">OVERVIEW</div>
        <h1 id="pageTitle">Jordan Vale</h1>
        <div class="sub" id="pageSub">—</div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
