<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Career Sim</title>
  <style>
    :root {
      --bg: #0b0f17; --bg2: #0f141f; --panel: #141b28; --panel2: #1b2436; --panel3: #232d42;
      --line: #2a354a; --line2: #3a4660; --accent: #2dd4a0; --accent-dim: rgba(45, 212, 160, 0.15);
      --blue: #3b82f6; --blue-dim: rgba(59, 130, 246, 0.2); --red: #ef4444; --orange: #f59e0b;
      --gold: #eab308; --text: #f1f5f9; --muted: #94a3b8; --muted2: #64748b; --sidebar-w: 220px;
      --radius: 10px; --shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; font-size: 13px; -webkit-font-smoothing: antialiased; }
    #app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; min-width: 1024px; }
    aside { background: linear-gradient(180deg, #121826 0%, #0d121c 100%); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
    .brand .tag { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
    .brand .season { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 500; }
    nav.side { flex: 1; padding: 10px; overflow-y: auto; }
    nav.side .nav-group { font-size: 10px; font-weight: 700; color: var(--muted2); letter-spacing: 0.1em; padding: 12px 12px 6px; text-transform: uppercase; }
    nav.side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; color: var(--muted); font-size: 13px; padding: 9px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 1px; }
    nav.side button:hover { background: var(--panel2); color: var(--text); }
    nav.side button.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
    nav.side button .ico { width: 18px; text-align: center; opacity: 0.7; font-size: 12px; }
    .side-foot { border-top: 1px solid var(--line); padding: 14px 16px; background: rgba(0,0,0,0.25); }
    .side-foot .name { font-size: 13px; font-weight: 700; }
    .side-foot .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .side-foot .ovr-pill { display: inline-block; margin-top: 8px; background: var(--accent-dim); color: var(--accent); font-weight: 800; font-size: 12px; padding: 3px 10px; border-radius: 6px; }
    main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg2); }
    header.top { padding: 14px 28px 10px; flex-shrink: 0; border-bottom: 1px solid var(--line); background: rgba(15,20,31,0.9); display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    header.top .eyebrow { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
    header.top h1 { font-size: 22px; font-weight: 800; margin-top: 2px; letter-spacing: -0.02em; }
    header.top .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    header.top .actions { display: flex; gap: 8px; }
    .content { flex: 1; overflow-y: auto; padding: 18px 28px 32px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .section-title { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .grid-hero { display: grid; grid-template-columns: 320px 1fr; gap: 14px; }
    @media (max-width: 1200px) { .grid-hero { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }
    .hero-card { background: linear-gradient(145deg, #1a2740 0%, #121a2b 50%, #0e1624 100%); border: 1px solid var(--line2); border-radius: 14px; padding: 20px; position: relative; overflow: hidden; }
    .hero-top { display: flex; gap: 16px; align-items: flex-start; position: relative; }
    .ovr-box { width: 72px; height: 72px; border-radius: 12px; background: linear-gradient(135deg, var(--accent) 0%, #1a9e74 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #04120c; font-weight: 900; flex-shrink: 0; }
    .ovr-box .num { font-size: 28px; line-height: 1; }
    .ovr-box .pos { font-size: 11px; font-weight: 800; }
    .hero-info h2 { font-size: 20px; font-weight: 800; }
    .hero-info .club { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
    .hero-stat { background: rgba(0,0,0,0.25); border-radius: 8px; padding: 10px 8px; text-align: center; }
    .hero-stat .v { font-size: 16px; font-weight: 800; }
    .hero-stat .l { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; }
    .stat-tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .stat-tile .label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .stat-tile .value { font-size: 22px; font-weight: 800; margin-top: 4px; }
    .stat-tile .hint { font-size: 11px; color: var(--muted2); margin-top: 4px; }
    table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.data th { text-align: left; font-size: 10px; font-weight: 700; color: var(--muted2); text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.2); }
    table.data td { padding: 9px 10px; border-bottom: 1px solid rgba(42,53,74,0.5); }
    table.data tr.me td { background: var(--accent-dim); }
    .pos-badge { display: inline-block; min-width: 28px; text-align: center; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: var(--panel3); color: var(--muted); }
    .rating { display: inline-flex; min-width: 36px; padding: 3px 8px; border-radius: 6px; font-weight: 800; font-size: 12px; }
    .rating.high { background: rgba(45,212,160,0.2); color: var(--accent); }
    .rating.mid { background: rgba(245,158,11,0.15); color: var(--orange); }
    .rating.low { background: rgba(239,68,68,0.15); color: var(--red); }
    .btn { background: var(--accent); color: #04120c; border: none; font-weight: 700; font-size: 13px; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    .btn.secondary { background: var(--panel3); color: var(--text); border: 1px solid var(--line2); }
    .btn.sm { padding: 6px 12px; font-size: 12px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .match-score { text-align: center; padding: 8px 0 16px; }
    .match-score .teams { font-size: 20px; font-weight: 800; }
    .match-score .score-num { color: var(--accent); margin: 0 10px; }
    .poss-bar { display: flex; height: 28px; border-radius: 8px; overflow: hidden; font-size: 12px; font-weight: 800; margin: 12px 0 18px; }
    .poss-bar .h { background: var(--blue); display: flex; align-items: center; justify-content: center; }
    .poss-bar .a { background: #93c5fd; color: #0f172a; display: flex; align-items: center; justify-content: center; }
    .stat-row { display: grid; grid-template-columns: 1fr 1.4fr 1fr; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(42,53,74,0.4); }
    .stat-row .hl { text-align: right; font-weight: 700; }
    .stat-row .al { text-align: left; font-weight: 700; }
    .stat-row .lab { text-align: center; color: var(--muted); font-size: 12px; }
    .stat-row .chip { display: inline-block; padding: 3px 10px; border-radius: 12px; background: var(--panel3); font-weight: 700; font-size: 12px; }
    .stat-row .chip.blue { background: var(--blue-dim); color: #93c5fd; }
    .feed-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
    .feed-card .badge { display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px; background: var(--panel3); color: var(--muted); text-transform: uppercase; }
    .feed-card .badge.breaking { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .feed-card .badge.next-match { background: var(--accent-dim); color: var(--accent); }
    .feed-card .headline { font-size: 14px; font-weight: 700; }
    .feed-card .body { font-size: 12.5px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
    .feed-card .meta { font-size: 11px; color: var(--muted2); margin-top: 10px; }
    .press-q { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .press-q .q { font-weight: 600; margin-bottom: 10px; }
    .press-q .opts { display: flex; flex-direction: column; gap: 6px; }
    .press-q .opts button { text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
    .press-q .opts button:hover { border-color: var(--accent); background: var(--accent-dim); }
    .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 18px; text-align: center; padding: 40px; background: radial-gradient(ellipse at 50% 30%, #1a2740 0%, var(--bg) 60%); }
    .gate .logo { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: var(--accent); }
    .gate h1 { font-size: 36px; font-weight: 900; }
    .gate p { color: var(--muted); max-width: 440px; line-height: 1.5; font-size: 14px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel2); border: 1px solid var(--line2); padding: 14px 18px; border-radius: 12px; font-size: 13px; max-width: 380px; z-index: 50; display: none; box-shadow: var(--shadow); }
    .toast.show { display: block; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div id="gate" class="gate" style="overflow-y:auto;justify-content:flex-start;padding:40px 20px 60px">
    <div class="logo" style="margin-top:24px">FOOTBALL CAREER SIM</div>
    <h1 style="font-size:28px">Create your player</h1>
    <p style="margin-bottom:8px">Choose preferred foot, position, nationality and build — all feed the simulation.</p>
    <form id="createForm" style="width:100%;max-width:520px;text-align:left;margin-top:12px">
      <div class="panel" style="margin-bottom:12px">
        <div class="section-title" style="margin-top:0">Identity</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">First name
            <input name="firstName" value="Jordan" required style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px" />
          </label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Last name
            <input name="lastName" value="Vale" required style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px" />
          </label>
        </div>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:10px">Nationality
          <select name="nationality" style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px">
            <option>England</option><option>Spain</option><option>Germany</option><option>Italy</option><option>France</option><option>Portugal</option><option>Netherlands</option><option>Brazil</option><option>Argentina</option><option>Nigeria</option><option>Belgium</option><option>Croatia</option><option>Senegal</option><option>Morocco</option><option>Japan</option><option>USA</option>
          </select>
        </label>
      </div>
      <div class="panel" style="margin-bottom:12px">
        <div class="section-title" style="margin-top:0">On the pitch</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Position
            <select name="position" style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px">
              <option>GK</option><option>CB</option><option>LB</option><option>RB</option><option>CDM</option><option>CM</option><option>CAM</option><option>LM</option><option>RM</option><option>LW</option><option selected>RW</option><option>CF</option><option>ST</option>
            </select>
          </label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Preferred foot
            <select name="preferredFoot" style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px">
              <option value="Right" selected>Right</option><option value="Left">Left</option><option value="Both">Both</option>
            </select>
          </label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Build
            <select name="physicalProfile" style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px">
              <option value="Slight">Slight</option><option value="Average">Average</option><option value="Athletic" selected>Athletic</option><option value="Powerful">Powerful</option><option value="Tall">Tall</option>
            </select>
          </label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Height (cm)
            <input name="heightCm" type="number" min="160" max="205" placeholder="Auto from build" style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px" />
          </label>
        </div>
      </div>
      <div class="panel" style="margin-bottom:16px">
        <div class="section-title" style="margin-top:0">Career start</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Age
            <input name="age" type="number" min="15" max="21" value="17" style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px" />
          </label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Potential (55–95)
            <input name="potential" type="number" min="55" max="95" value="86" style="padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px" />
          </label>
        </div>
      </div>
      <button type="submit" class="btn" id="btnStart" style="width:100%;padding:14px;font-size:15px">Start Player Career</button>
    </form>
  </div>
  <div id="app" class="hidden">
    <aside>
      <div class="brand"><div class="tag">Career Mode</div><div class="season" id="sideSeason">—</div></div>
      <nav class="side" id="sideNav">
        <div class="nav-group">Career</div>
        <button data-view="overview" class="active"><span class="ico">◉</span> Overview</button>
        <button data-view="development"><span class="ico">↗</span> Development</button>
        <button data-view="inbox"><span class="ico">✉</span> Inbox</button>
        <div class="nav-group">Club</div>
        <button data-view="squad"><span class="ico">☰</span> Squad</button>
        <button data-view="league"><span class="ico">▦</span> League Table</button>
        <button data-view="stats"><span class="ico">▣</span> Match Stats</button>
        <button data-view="clubSocial"><span class="ico">◎</span> Club Social</button>
        <div class="nav-group">World</div>
        <button data-view="transfers"><span class="ico">⇄</span> Transfers</button>
        <button data-view="market"><span class="ico">€</span> Market</button>
        <button data-view="news"><span class="ico">◈</span> News</button>
        <button data-view="press"><span class="ico">🎤</span> Press</button>
      </nav>
      <div class="side-foot"><div class="name" id="sideName">—</div><div class="meta" id="sideMeta">—</div><div class="ovr-pill" id="sideOvr">— OVR</div></div>
    </aside>
    <main>
      <header class="top">
        <div class="left"><div class="eyebrow" id="pageEyebrow">OVERVIEW</div><h1 id="pageTitle">Career</h1><div class="sub" id="pageSub">—</div></div>
        <div class="actions"><button class="btn secondary sm" id="btnTrain">Train</button><button class="btn sm" id="btnMatchday">Play Matchday</button></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
